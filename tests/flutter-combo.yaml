schemaVersion: "2.0.0"
metadataTest:
  envVars:
    - key: "FLUTTER_HOME"
      value: "/opt/flutter"
commandTests:
  - name: "Check Flutter Installation"
    command: "flutter"
    args: ["--version"]
    expectedOutput: ["Flutter"]
  - name: "Check Android SDK Installation"
    command: "sdkmanager"
    args: ["--version"]
    expectedOutput: ["[0-9]+"]
  - name: "Check Java Installation"
    command: "java"
    args: ["--version"]
    expectedOutput: ["OpenJDK"]
  - name: "Check Firebase CLI"
    command: "firebase"
    args: ["--version"]
    expectedOutput: ["[0-9]+\\.[0-9]+\\.[0-9]+"]
  - name: "Check Chrome Installation"
    command: "google-chrome-stable"
    args: ["--version"]
    expectedOutput: ["Google Chrome"]
