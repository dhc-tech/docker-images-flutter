schemaVersion: "2.0.0"
commandTests:
  - name: "clang"
    command: "clang"
    args: ["--version"]
    expectedOutput: ["clang version"]
  - name: "cmake"
    command: "cmake"
    args: ["--version"]
    expectedOutput: ["cmake version"]
  - name: "ninja"
    command: "ninja"
    args: ["--version"]
    expectedOutput: ["[0-9]+"]
  - name: "GTK dev files"
    command: "pkg-config"
    args: ["--exists", "gtk+-3.0"]
