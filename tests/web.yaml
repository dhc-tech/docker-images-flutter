schemaVersion: "2.0.0"
metadataTest:
  envVars:
    - key: "CHROME_EXECUTABLE"
      value: "/usr/bin/google-chrome-stable"
commandTests:
  - name: "Chrome installed"
    command: "dpkg-query"
    args: ["-W", "-f=${Package} ${Version}", "google-chrome-stable"]
    expectedOutput: ["google-chrome-stable [0-9]+"]
  # Headless Chrome prints nothing for --version, so only the exit code is checked.
  - name: "Chrome launches"
    command: "google-chrome-stable"
    args: ["--headless", "--disable-gpu", "--no-sandbox", "--version"]
