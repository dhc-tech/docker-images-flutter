schemaVersion: "2.0.0"
metadataTest:
  envVars:
    - key: "CHROME_EXECUTABLE"
      value: "/usr/bin/google-chrome-stable"
commandTests:
  - name: "Chrome installed"
    command: "dpkg-query"
    args: ["-W", "google-chrome-stable"]
    expectedOutput: ["google-chrome-stable\\s+[0-9]+"]
  # Exit code only: the printed version is not reliably emitted on a cold start.
  - name: "Chrome launches"
    command: "google-chrome-stable"
    args: ["--headless", "--disable-gpu", "--no-sandbox", "--version"]
