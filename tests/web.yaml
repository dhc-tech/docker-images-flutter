schemaVersion: "2.0.0"
metadataTest:
  envVars:
    - key: "CHROME_EXECUTABLE"
      value: "/usr/bin/google-chrome-stable"
commandTests:
  # Chrome occasionally prints nothing on a cold first start inside the test
  # runner; retry before failing. The build itself already smoke-tests launch.
  - name: "Chrome"
    command: "bash"
    args:
      - "-c"
      - 'for i in 1 2 3; do out=$(google-chrome-stable --headless --disable-gpu --no-sandbox --version 2>&1) && [ -n "$out" ] && echo "$out" && exit 0; sleep 2; done; exit 1'
    expectedOutput: ["Google Chrome"]
