---
name: Cleanup GHCR Container Versions

# Weekly purge of untagged image versions in GHCR. Every release moves the
# <version>/stable/latest tags onto new digests, leaving the old ones untagged.
#
# Tagged versions are never touched. The retention action protects the child
# manifests of multi-arch images and of images with provenance/SBOM
# attestations, which GHCR also lists as untagged; a plain "delete untagged"
# would delete them and break pulls of the tagged image.
#
# Manual runs default to dry-run: the log lists what would be deleted.
on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log what would be deleted"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    name: Clean untagged versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "flutter flutter-android flutter-web flutter-linux"
          tag-selection: untagged
          cut-off: 7d
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
