---
name: Build and push CI image

# Publishes to GHCR:
#   flutter-base                            Flutter SDK + Firebase CLI
#   flutter-android / -web / -linux         base + one platform's toolchain
#   flutter                                 base + Android + Web + Linux
# Every toolchain is baked in at build time, so consumers pull a ready image
# and spend no CI minutes installing SDKs. All platform images are built
# from docker/scripts/ and share the one published base.
#
# Docker/Linux cannot build iOS, macOS or Windows — those need the real OS.
#
# Tags: <version>, <major.minor>, <major>; plus `latest`, `pinned`, `stable`
# when building the version in FLUTTER_VERSION.
#
# No schedule on purpose: check-flutter-version.yml polls flutter/flutter and
# merges a FLUTTER_VERSION bump for a real new stable release; that merge
# triggers this workflow.
on:
  push:
    branches: [main]
    paths:
      - docker/**
      - FLUTTER_VERSION
      - .github/workflows/build-and-push.yml
      - .github/workflows/_build-image.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Flutter version to build (default: pinned version in FLUTTER_VERSION)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      major_minor: ${{ steps.v.outputs.major_minor }}
      major: ${{ steps.v.outputs.major }}
      is_latest: ${{ steps.v.outputs.is_latest }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          current="$(cat FLUTTER_VERSION)"
          version="${INPUT_VERSION:-$current}"
          {
            echo "version=$version"
            echo "major_minor=${version%.*}"
            echo "major=${version%%.*}"
            echo "is_latest=$([ "$version" = "$current" ] && echo true || echo false)"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

  base:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      image: flutter-base
      dockerfile: base
      description: Flutter SDK + Firebase CLI base image
      owner: ${{ needs.version.outputs.owner }}
      version: ${{ needs.version.outputs.version }}
      major_minor: ${{ needs.version.outputs.major_minor }}
      major: ${{ needs.version.outputs.major }}
      is_latest: ${{ needs.version.outputs.is_latest == 'true' }}
      build_args: FLUTTER_REF=${{ needs.version.outputs.version }}

  images:
    needs: [version, base]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: flutter, dockerfile: combo, description: "Flutter Docker image for CI/CD (Android + Web + Linux)"}
          - {image: flutter-android, dockerfile: android, description: "Flutter Docker image for CI/CD (android)"}
          - {image: flutter-web, dockerfile: web, description: "Flutter Docker image for CI/CD (web)"}
          - {image: flutter-linux, dockerfile: linux, description: "Flutter Docker image for CI/CD (linux)"}
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      description: ${{ matrix.description }}
      owner: ${{ needs.version.outputs.owner }}
      version: ${{ needs.version.outputs.version }}
      major_minor: ${{ needs.version.outputs.major_minor }}
      major: ${{ needs.version.outputs.major }}
      is_latest: ${{ needs.version.outputs.is_latest == 'true' }}
      build_args: BASE_IMAGE=ghcr.io/${{ needs.version.outputs.owner }}/flutter-base:${{ needs.version.outputs.version }}

  release:
    needs: [version, images]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: Flutter ${{ needs.version.outputs.version }}
          body: |
            Prebuilt Flutter CI images — SDKs, NDK, Chrome and desktop toolchains are already installed, so builds start immediately.

            | Image | Included | Pull |
            |---|---|---|
            | **`flutter`** | Android SDK + Chrome + Linux desktop | `docker pull ghcr.io/${{ needs.version.outputs.owner }}/flutter:${{ needs.version.outputs.version }}` |
            | **`flutter-android`** | Android SDK + NDK | `docker pull ghcr.io/${{ needs.version.outputs.owner }}/flutter-android:${{ needs.version.outputs.version }}` |
            | **`flutter-web`** | Headless Chrome | `docker pull ghcr.io/${{ needs.version.outputs.owner }}/flutter-web:${{ needs.version.outputs.version }}` |
            | **`flutter-linux`** | Linux desktop toolchain | `docker pull ghcr.io/${{ needs.version.outputs.owner }}/flutter-linux:${{ needs.version.outputs.version }}` |

            Tags: `${{ needs.version.outputs.version }}`, `${{ needs.version.outputs.major_minor }}`, `${{ needs.version.outputs.major }}`, `pinned` (reproducible), `stable`, `latest`.

            Built on Ubuntu with a pinned digest; provenance and SBOM attestations are attached in GHCR.

            ---
            *Generated automatically by [${{ github.repository }}](https://github.com/${{ github.repository }})*
          draft: false
          prerelease: false
