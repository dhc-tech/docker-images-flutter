name: Build and push CI image

# Builds Android + Web + Linux desktop. Docker/Linux can't build iOS,
# macOS, or Windows at all — needs the real OS. See README.md.
#
# Only `stable` (mutable) and `pinned`/`<version>` (immutable) are
# published — no `beta`/`main` channel tags.
#
# No polling/schedule here on purpose: check-flutter-version.yml already
# polls flutter/flutter every 15 minutes and only merges a FLUTTER_VERSION
# bump when a genuinely new stable release is tagged. That merge is what
# triggers this workflow (via the FLUTTER_VERSION path filter below) — so
# a rebuild only ever happens for a real new release or a manual/
# Dockerfile-change run, never on every incidental commit SHA change on
# flutter/flutter's stable branch.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - FLUTTER_VERSION
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned Flutter version
        id: pinned
        run: echo "version=$(cat FLUTTER_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            FLUTTER_REF=${{ steps.pinned.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.pinned.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/flutter:${{ steps.pinned.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/flutter:pinned
            ghcr.io/${{ github.repository_owner }}/flutter:stable
          # Shares the same GitHub Actions cache pr-check.yml already
          # warms on every PR — the base OS/Android/Chrome layers (slow,
          # network-heavy) are reused here instead of rebuilt from
          # scratch on every version bump.
          cache-from: type=gha
          cache-to: type=gha,mode=max
