name: PR build check

# Validates a PR actually builds before it's allowed to auto-merge — see
# auto-merge.yml. Build-only, no push (PRs don't get package write
# access). Runs on every PR to main, not just Dockerfile/FLUTTER_VERSION
# changes: Dependabot's github-actions PRs touch workflow files, and if
# this check never ran for those, the "build-check" required status
# (branch protection) would never be satisfied and the PR would sit
# blocked forever instead of auto-merging.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Named `build-check` and left untouched (path filter, step names) —
  # this exact name is the branch protection required status check
  # (README's "One-time repo setup"). Renaming or restructuring it would
  # leave that required check permanently unsatisfiable until someone
  # updates branch protection by hand.
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A workflow-only change (e.g. Dependabot bumping actions/checkout's
      # version) can't affect the built image — skip the actual (slow)
      # Docker build for those, so the required check still passes
      # quickly instead of every unrelated PR paying full build cost.
      - name: Check whether the image itself is affected
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qE '^(Dockerfile|FLUTTER_VERSION)$'; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile/FLUTTER_VERSION change — skipping the image build."
          fi

      - if: steps.changed.outputs.affected == 'true'
        name: Read pinned Flutter version
        id: pinned
        run: echo "version=$(cat FLUTTER_VERSION)" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.affected == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.changed.outputs.affected == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            FLUTTER_REF=${{ steps.pinned.outputs.version }}
          # GitHub Actions cache for Docker layers — the base OS/Android/
          # Chrome layers (the slow, network-heavy part) rarely change
          # even when FLUTTER_VERSION does, so most builds after the
          # first reuse them from cache instead of re-downloading and
          # re-installing everything from scratch every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A required status check on main, same as build-check (see README's
  # "One-time repo setup") — configured as 3 separate required contexts,
  # one per matrix entry: "build-check-platforms (android/web/linux)".
  build-check-platforms:
    strategy:
      fail-fast: false
      matrix:
        platform: [android, web, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check whether this platform's image is affected
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" \
              | grep -qE "^(base\.Dockerfile|${{ matrix.platform }}\.Dockerfile|FLUTTER_VERSION)$"; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "No relevant Dockerfile/FLUTTER_VERSION change for ${{ matrix.platform }} — skipping."
          fi

      - if: steps.changed.outputs.affected == 'true'
        name: Read pinned Flutter version
        id: pinned
        run: echo "version=$(cat FLUTTER_VERSION)" >> "$GITHUB_OUTPUT"

      # driver: docker, not the default docker-container — see the
      # matching comment in build-and-push.yml's build-platforms job.
      # The docker-container driver's isolated BuildKit container can't
      # see an image `--load`'d into the host Docker Engine, so a later
      # `FROM flutter-base:build` fails trying to pull it from Docker
      # Hub instead. driver: docker builds directly against the host
      # engine, so the image is visible immediately — confirmed against
      # a real failed run even after trying the documented
      # `docker-image://` build-context workaround.
      - if: steps.changed.outputs.affected == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - if: steps.changed.outputs.affected == 'true'
        name: Build shared base layer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: base.Dockerfile
          load: true
          tags: flutter-base:build
          build-args: |
            FLUTTER_REF=${{ steps.pinned.outputs.version }}

      - if: steps.changed.outputs.affected == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.platform }}.Dockerfile
          push: false
          build-args: |
            BASE_IMAGE=flutter-base:build
