---
name: PR build check

# Validates a PR builds and passes its container-structure-tests before it
# can auto-merge (see auto-merge.yml). Build-only, no push. Runs on every PR
# to main so the required status checks below are always reported, even for
# workflow-only PRs (Dependabot) — the composite action skips the slow build
# when nothing the image is built from changed.
#
# Job names are branch-protection required status checks — do not rename:
#   build-check, build-check-platforms (android), (web), (linux)
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the action diffs base..head, which needs history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-and-test
        with:
          image: combo

  build-check-platforms:
    strategy:
      fail-fast: false
      matrix:
        platform: [android, web, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-and-test
        with:
          image: ${{ matrix.platform }}
