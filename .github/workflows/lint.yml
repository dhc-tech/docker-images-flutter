name: Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: "docker/Dockerfile"
          recursive: true
          ignore: "DL3008,DL3013" # Ignored specific warnings that might be unavoidable
