name: Auto-merge PRs

# Supports two safe auto-merge workflows:
# 1. Trusted bot PRs (Flutter version bumps & Dependabot):
#    Automatically approved via GH_PAT_WORKFLOW and queued for auto-merge.
# 2. Human PRs:
#    - Automatically applies 'needs-approval' label when opened or updated.
#    - When approved by a maintainer/collaborator, automatically removes 'needs-approval',
#      adds 'automerge', and queues the PR for squash auto-merge once CI checks pass.

on:
  pull_request_target:
    types: [opened, labeled, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

jobs:
  enable-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_PAT: ${{ secrets.GH_PAT_WORKFLOW }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTOR_LOGIN: ${{ github.event.review.user.login || github.event.sender.login }}
        run: |
          set -e
          info="$(gh pr view "$PR_URL" --json labels,author,headRefName,reviewDecision)"
          has_bump_label="$(echo "$info" | jq -r '[.labels[].name] | contains(["automated-flutter-bump"])')"
          has_automerge_label="$(echo "$info" | jq -r '[.labels[].name] | (contains(["automerge"]) or contains(["auto-merge"]))')"
          author="$(echo "$info" | jq -r '.author.login')"
          head_ref="$(echo "$info" | jq -r '.headRefName')"
          review_decision="$(echo "$info" | jq -r '.reviewDecision')"

          case "$author" in
            dependabot\[bot\]|app/dependabot) is_dependabot=true ;;
            *) is_dependabot=false ;;
          esac

          # Strict verification: automated-flutter-bump is only trusted if authored by
          # the GitHub Actions bot and originating from a flutter-bump/* branch
          is_trusted_bump=false
          if [ "$has_bump_label" = "true" ]; then
            case "$head_ref" in
              flutter-bump/*)
                case "$author" in
                  github-actions\[bot\]|app/github-actions)
                    is_trusted_bump=true
                    ;;
                esac
                ;;
            esac
          fi

          # Case 1: Trusted automated bot PRs (genuine version bump or Dependabot)
          if [ "$is_trusted_bump" = "true" ] || [ "$is_dependabot" = "true" ]; then
            echo "Processing automated bot PR by $author (branch: $head_ref)..."

            # Approve the PR using dedicated PAT if available
            if [ -n "$BOT_PAT" ]; then
              echo "Approving PR using configured BOT_PAT..."
              GH_TOKEN="$BOT_PAT" gh pr review --approve "$PR_URL"
            elif [ "$is_dependabot" = "true" ]; then
              echo "Approving Dependabot PR using GITHUB_TOKEN..."
              gh pr review --approve "$PR_URL"
            else
              echo "::error::GH_PAT_WORKFLOW is required to auto-approve flutter-bump PRs under strict branch protection."
              exit 1
            fi

            echo "Enabling auto-merge for bot PR..."
            gh pr merge --auto --squash "$PR_URL"
            exit 0
          fi

          # Case 2: Human PR approval handling
          if [ "$review_decision" = "APPROVED" ]; then
            echo "PR has been approved! Removing 'needs-approval' label and enabling auto-merge..."
            gh pr edit "$PR_URL" --remove-label "needs-approval" || true
            gh pr edit "$PR_URL" --add-label "automerge" || true
            gh pr merge --auto --squash "$PR_URL" || true
            exit 0
          else
            echo "PR is not yet approved (reviewDecision: $review_decision). Ensuring 'needs-approval' label is set..."
            gh pr edit "$PR_URL" --add-label "needs-approval" || true
          fi

          # Case 3: Explicit 'automerge' label added by authorized collaborator
          if [ "$has_automerge_label" = "true" ]; then
            echo "Checking permissions for automerge trigger by $ACTOR_LOGIN..."
            is_authorized=false
            if [ "$ACTOR_LOGIN" = "${{ github.repository_owner }}" ]; then
              is_authorized=true
            else
              can_push_or_admin="$(gh api "repos/${{ github.repository }}/collaborators/${ACTOR_LOGIN}/permission" --jq '(.permissions.push // false) or (.permissions.admin // false)' 2>/dev/null || echo "false")"
              if [ "$can_push_or_admin" = "true" ]; then
                is_authorized=true
              fi
            fi

            if [ "$is_authorized" = "true" ]; then
              echo "Authorized contributor $ACTOR_LOGIN enabled auto-merge. Queuing PR..."
              gh pr merge --auto --squash "$PR_URL"
              exit 0
            else
              echo "::error::User $ACTOR_LOGIN does not have contributor/write permissions to enable auto-merge."
              exit 1
            fi
          fi
