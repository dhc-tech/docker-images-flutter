name: Auto-merge PRs

# Supports two safe auto-merge workflows:
# 1. Trusted bot PRs (Flutter version bumps & Dependabot):
#    Automatically approved via GH_PAT_WORKFLOW and queued for auto-merge.
# 2. Human PRs with 'automerge' label added by a contributor/maintainer:
#    Queued for auto-merge (still strictly requires 1 human approval and all CI checks green).

on:
  pull_request_target:
    types: [opened, labeled, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enable-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOW || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.GH_PAT_WORKFLOW != '' }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          SENDER_ASSOCIATION: ${{ github.event.sender.author_association }}
        run: |
          set -e
          info="$(gh pr view "$PR_URL" --json labels,author)"
          has_bump_label="$(echo "$info" | jq -r '[.labels[].name] | contains(["automated-flutter-bump"])')"
          has_automerge_label="$(echo "$info" | jq -r '[.labels[].name] | (contains(["automerge"]) or contains(["auto-merge"]))')"
          author="$(echo "$info" | jq -r '.author.login')"

          case "$author" in
            dependabot\[bot\]|app/dependabot) is_dependabot=true ;;
            *) is_dependabot=false ;;
          esac

          # Case 1: Trusted automated bot PRs (version bump or Dependabot)
          if [ "$has_bump_label" = "true" ] || [ "$is_dependabot" = "true" ]; then
            echo "Processing automated bot PR by $author..."

            # Approve the PR using dedicated PAT if available
            if [ "$HAS_PAT" = "true" ]; then
              echo "Approving PR using configured GH_PAT_WORKFLOW..."
              gh pr review --approve "$PR_URL"
            elif [ "$is_dependabot" = "true" ]; then
              echo "Approving Dependabot PR using GITHUB_TOKEN..."
              gh pr review --approve "$PR_URL"
            else
              echo "::error::GH_PAT_WORKFLOW is required to auto-approve flutter-bump PRs under strict branch protection."
              exit 1
            fi

            echo "Enabling auto-merge for bot PR..."
            gh pr merge --auto --squash "$PR_URL"
            exit 0
          fi

          # Case 2: Human PR with 'automerge' label
          if [ "$has_automerge_label" = "true" ]; then
            echo "Checking permissions for automerge label trigger by $SENDER_LOGIN ($SENDER_ASSOCIATION)..."

            is_authorized=false
            case "$SENDER_ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR)
                is_authorized=true
                ;;
            esac

            # Fallback API check for write permissions
            if [ "$is_authorized" != "true" ]; then
              can_push="$(gh api "repos/${{ github.repository }}/collaborators/${SENDER_LOGIN}/permission" --jq '.permissions.push // false' 2>/dev/null || echo "false")"
              if [ "$can_push" = "true" ]; then
                is_authorized=true
              fi
            fi

            if [ "$is_authorized" = "true" ]; then
              echo "Authorized contributor $SENDER_LOGIN requested auto-merge via label. Enabling auto-merge (requires human approval & passing CI)..."
              gh pr merge --auto --squash "$PR_URL"
              exit 0
            else
              echo "::error::User $SENDER_LOGIN does not have contributor/write permissions to enable auto-merge."
              exit 1
            fi
          fi

          echo "PR does not qualify for auto-merge (not a trusted bot and lacks authorized automerge label)."
