docker:
  - any:
      - 'docker/**'
      - '.dockerignore'

github-actions:
  - any:
      - '.github/workflows/**'

dependencies:
  - any:
      - '.github/dependabot.yml'
      - 'FLUTTER_VERSION'

documentation:
  - any:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'

testing:
  - any:
      - 'tests/**'

devops:
  - any:
      - '.agent/**'
      - '.cursorrules'
      - '.pre-commit-config.yaml'
      - '.yamllint'
      - 'Makefile'
      - '.github/labeler.yml'
      - '.github/CODEOWNERS'

security:
  - any:
      - 'SECURITY.md'
      - '.github/workflows/scorecard.yml'
