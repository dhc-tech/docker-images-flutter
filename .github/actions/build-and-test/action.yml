name: Build and test image
description: >-
  Builds one image stage locally (no push) and runs its
  container-structure-tests. Skips cleanly when the PR does not touch
  anything that image is built from. Requires a prior checkout with
  fetch-depth 0.

inputs:
  image:
    description: android | web | linux | combo
    required: true

runs:
  using: composite
  steps:
    - name: Check whether this image is affected
      id: changed
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -e
        case "$IMAGE" in
          combo) pattern='^(docker/|tests/|FLUTTER_VERSION$|\.github/actions/build-and-test/)' ;;
          *) pattern="^(docker/Dockerfile|docker/scripts/install-${IMAGE}\.sh|tests/(base|${IMAGE})\.yaml|FLUTTER_VERSION$|\.github/actions/build-and-test/)" ;;
        esac
        if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE "$pattern"; then
          echo "affected=true" >> "$GITHUB_OUTPUT"
        else
          echo "affected=false" >> "$GITHUB_OUTPUT"
          echo "Nothing $IMAGE is built from changed — skipping."
        fi

    - if: steps.changed.outputs.affected == 'true'
      id: pinned
      shell: bash
      run: echo "version=$(cat FLUTTER_VERSION)" >> "$GITHUB_OUTPUT"

    - if: steps.changed.outputs.affected == 'true'
      name: Install container-structure-test
      shell: bash
      run: |
        curl -fsSLo container-structure-test https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64
        chmod +x container-structure-test
        sudo mv container-structure-test /usr/local/bin/

    - if: steps.changed.outputs.affected == 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        driver: docker

    - if: steps.changed.outputs.affected == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: docker/Dockerfile
        target: ${{ inputs.image }}
        load: true
        tags: flutter-${{ inputs.image }}:build
        build-args: |
          FLUTTER_REF=${{ steps.pinned.outputs.version }}

    # The publish step only runs after merge, so validate the bake file
    # (syntax, targets, tag logic) here, where a mistake is still cheap.
    - if: steps.changed.outputs.affected == 'true' && inputs.image == 'combo'
      name: Validate docker-bake.hcl
      shell: bash
      env:
        FLUTTER_REF: ${{ steps.pinned.outputs.version }}
        IS_LATEST: "true"
        MAJOR_MINOR: "0.0"
        MAJOR: "0"
      run: docker buildx bake -f docker/docker-bake.hcl --print

    # combo = every platform, so it runs every platform's tests.
    - if: steps.changed.outputs.affected == 'true'
      name: Run container-structure-test
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -e
        configs=(--config tests/base.yaml)
        if [ "$IMAGE" = combo ]; then
          configs+=(--config tests/android.yaml --config tests/web.yaml --config tests/linux.yaml)
        else
          configs+=(--config "tests/${IMAGE}.yaml")
        fi
        container-structure-test test --image "flutter-${IMAGE}:build" "${configs[@]}"
